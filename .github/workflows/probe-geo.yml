name: probe-geo
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          O="Origin: https://powerflash1000.github.io"
          show() { echo "=== $1"; curl -s -m 30 -H "$O" -A "news-reels-studio-probe" -D /tmp/h -o /tmp/b "$2"; grep -i -E "^HTTP|access-control|content-type" /tmp/h; head -c 700 /tmp/b; echo; }
          show open-meteo "https://geocoding-api.open-meteo.com/v1/search?name=Dawson%20City&count=5&language=ar&format=json"
          show open-meteo-ar "https://geocoding-api.open-meteo.com/v1/search?name=%D8%AF%D8%A7%D9%88%D8%B3%D9%88%D9%86&count=5&language=ar&format=json"
          show nominatim "https://nominatim.openstreetmap.org/search?q=Dawson+City&format=jsonv2&accept-language=ar&limit=3&addressdetails=1"
          show photon "https://photon.komoot.io/api/?q=Dawson%20City&limit=3&lang=en"
