name: hf-trends-reel
# ريل «ترند مصر النهارده» كل يوم بـ HyperFrames — الفيديو بيطلع في صفحة الـ run تحت «Artifacts»
on:
  schedule:
    - cron: '41 16 * * *'   # 6:41 م بتوقيت القاهرة (بعد ما الرادار يتحدث)
  workflow_dispatch:
    inputs:
      region:
        description: 'البلد (eg, sa, ae, ma, dz, iq, jo, lb, kw)'
        default: 'eg'
permissions:
  contents: write
concurrency:
  group: hf-trends-reel-${{ inputs.region || 'eg' }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg + emoji font
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-color-emoji
      - name: render
        env:
          HYPERFRAMES_TELEMETRY: '0'
        run: node tools/hf-trends.mjs --region "${{ inputs.region || 'eg' }}" --out "out/trends-${{ inputs.region || 'eg' }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: trends-reel-${{ inputs.region || 'eg' }}-${{ github.run_number }}
          path: out/
          retention-days: 14
      # 🎞️ للاستوديو: الفيديو على رابط ثابت (release «daily-reels») + data/daily-reels.json فيه التاريخ والمواضيع
      - name: publish for the studio
        env:
          GH_TOKEN: ${{ github.token }}
          REGION: ${{ inputs.region || 'eg' }}
        run: |
          gh release view daily-reels >/dev/null 2>&1 || gh release create daily-reels --title "🎞️ ريلز الترند اليومية" --notes "بيتحدث لوحده كل يوم من hf-trends-reel — الاستوديو بيعرضه في «🎞️ ريل الترند»." --latest=false
          gh release upload daily-reels "out/trends-$REGION.mp4" --clobber
          node tools/hf-trends-publish.mjs "$REGION" "${{ github.repository }}"
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add data/daily-reels.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily reel ($REGION)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
