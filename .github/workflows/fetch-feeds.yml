name: fetch-feeds
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-feeds
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fetch-feeds.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: cross-platform trends (Google, YouTube, X, TikTok — EG/SA)
        run: node tools/cross-trends.mjs
        continue-on-error: true
      - name: economic data (BLS, CFTC, FRED, EIA)
        run: node tools/econ.mjs
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - name: commit if changed
        run: |
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add data/feeds.json data/channel-ids.json data/gnews-urls.json data/trends.json
          [ -f data/yt-trending.json ] && git add data/yt-trending.json || true
          [ -f data/econ.json ] && git add data/econ.json || true
          [ -f data/cross.json ] && git add data/cross.json || true
          git diff --cached --quiet || (git commit -m "chore: update feeds" && git push)
