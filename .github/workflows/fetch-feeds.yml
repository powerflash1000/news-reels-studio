name: fetch-feeds
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-feeds
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fetch-feeds.mjs
      - name: commit if changed
        run: |
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add data/feeds.json data/channel-ids.json
          git diff --cached --quiet || (git commit -m "chore: update feeds" && git push)
