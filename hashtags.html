<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الهاشتاجات والترند — استوديو ريلز الأخبار</title>
<link rel="stylesheet" href="assets/css/style.css?v=mws6rwt8">
<style>body{margin:0}</style>
</head>
<body>
<div id="ht"></div>
<script type="module">
import { initI18n } from './js/i18n.js?v=mws6rwt8';
import { mountHashtags, hashtagPrompt } from './js/hashtags.js?v=mws6rwt8';
import { aiJSON } from './js/draft.js?v=mws6rwt8';
initI18n();
const tags = { type: 'array', items: { type: 'string' } };
mountHashtags(document.getElementById('ht'), {
  app: 'news', prefix: 'nrs:',
  ask: args => aiJSON({
    system: 'You help a news-reels creator pick honest, relevant hashtags. Reply only with the JSON asked for.',
    user: hashtagPrompt(args),
    schema: { type: 'object', properties: { ar: tags, en: tags, note: { type: 'string' } }, required: ['ar', 'en', 'note'], additionalProperties: false },
    maxTokens: 1200,
  }),
});
</script>
</body>
</html>
